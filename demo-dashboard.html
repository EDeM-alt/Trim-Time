<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a16"><title>TrimTime | Campus grooming, without the queue</title>
<style>
:root{--dark:#101a16;--ink:#17251d;--lime:#baf36d;--green:#477c35;--bg:#f4f6f0;--white:#fff;--muted:#718078;--line:#e4e9e1;--red:#b84b42;--amber:#a56b18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.topbar{height:72px;background:var(--dark);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(4vw,20px);position:sticky;top:0;z-index:5}.brand{font-weight:950;font-size:25px;letter-spacing:-1.4px;color:white;text-decoration:none}.brand span{color:var(--lime)}.top-actions{display:flex;gap:10px;align-items:center}.role-pill{border:1px solid #ffffff44;color:white;background:#ffffff0e;border-radius:30px;padding:9px 13px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.primary{background:var(--lime);color:var(--dark)}.dark{background:var(--dark);color:white}.light{background:#edf4e7;color:var(--green)}.outline{border:1px solid var(--line);background:white;color:var(--ink)}.danger{background:#fff0ee;color:var(--red)}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 15px}.side-label{font-size:10px;font-weight:900;color:#9aa49c;letter-spacing:1.7px;padding:8px 12px}.navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:0;background:transparent;color:#58665e;border-radius:11px;font-weight:700;margin:3px 0}.navbtn.active,.navbtn:hover{background:#edf6e4;color:#315b28}.aside-note{margin:30px 8px 0;padding:14px;background:#f2f6ed;border-radius:13px;color:#66736a;font-size:12px}.main{padding:30px clamp(18px,4vw,55px);max-width:1500px;width:100%;margin:auto}.welcome{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);font-weight:900}.welcome h1{font-size:clamp(27px,3vw,38px);letter-spacing:-1.5px;margin:5px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;gap:17px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0}.metric,.panel,.shop-card,.booking-card{background:white;border:1px solid var(--line);border-radius:17px;padding:19px}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;font-size:29px;letter-spacing:-1px;margin:7px 0}.metric em{font-style:normal;color:var(--green);font-size:12px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.panel h2,.panel h3{margin:0 0 13px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel-head h2{font-size:18px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:#859087;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.status{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:850;background:#edf6e7;color:#477c35}.status.pending{background:#fff5df;color:var(--amber)}.status.cancelled{background:#fff0ee;color:var(--red)}.status.completed{background:#edf0f3;color:#53616a}.cards{grid-template-columns:repeat(3,1fr)}.shop-card{padding:0;overflow:hidden}.shop-art{height:115px;background:linear-gradient(135deg,#d9ebc8,#f2f6ec);display:grid;place-items:center;font-size:44px}.shop-body{padding:17px}.shop-body h3{margin:0 0 3px}.muted{color:var(--muted);font-size:13px}.price{font-weight:900;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;background:#f0f3ed;border-radius:30px;font-size:12px;color:#536158}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.field.full{grid-column:1/-1}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{padding:13px 15px;background:#fff6df;border:1px solid #f3e3b8;border-radius:12px;color:#775a22;font-size:12px;margin:15px 0}.success{background:#edf7e6;border-color:#d9eacb;color:#426b32}.hero{background:linear-gradient(115deg,#101a16,#294632);border-radius:20px;padding:30px;color:white;margin-bottom:22px}.hero h2{font-size:clamp(27px,4vw,42px);line-height:1.08;letter-spacing:-1.5px;margin:10px 0}.hero p{color:#d0ddd2;max-width:600px}.hero .primary{margin-top:8px}.service-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:#07110dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{background:white;border-radius:20px;padding:25px;width:min(520px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:white;padding:13px 18px;border-radius:12px;z-index:40;box-shadow:0 10px 30px #0003}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px;position:sticky;top:72px;z-index:4;border-right:0;border-bottom:1px solid var(--line)}.side-label,.aside-note{display:none}.navbtn{width:auto;white-space:nowrap;padding:9px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.topbar{padding:0 14px}.topbar .brand{font-size:22px}.role-pill{font-size:12px;padding:8px}.main{padding:22px 14px}.welcome{display:block}.welcome .btn{margin-top:12px}.metrics{gap:9px}.metric{padding:14px}.metric strong{font-size:24px}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:23px}.top-actions .hide-mobile{display:none}}
</style></head>
<body>
<div class="shell">
<header class="topbar"><a class="brand" href="#" onclick="go('home');return false">Trim<span>Time</span>.</a><div class="top-actions"><span class="role-pill" id="roleLabel">Customer view</span><button class="btn primary" onclick="openRole()">Switch dashboard</button></div></header>
<div class="layout"><aside id="sidebar"></aside><main class="main" id="app"></main></div>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='trimtime_platform_v1';
const seed={shops:[
{id:'s1',name:'Campus Barbers',type:'Barbershop',area:'Near campus',rating:4.9,price:35,services:['Classic haircut','Fade','Beard trim'],active:true},
{id:'s2',name:'Glow Hair Studio',type:'Salon',area:'Student hostel area',rating:4.8,price:50,services:['Hair styling','Wash and trim'],active:true},
{id:'s3',name:'Fresh Line Studio',type:'Barbershop',area:'Near main gate',rating:4.7,price:35,services:['Classic haircut','Fade'],active:true},
{id:'s4',name:'Beauty Corner',type:'Braiding',area:'Campus vicinity',rating:4.9,price:70,services:['Braiding','Hair styling'],active:true}],
bookings:[],customers:[],commission:10,deposit:5};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}
let role='customer',page='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>'GH₵'+Number(n||0).toFixed(2);
const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const el=id=>document.getElementById(id);
function toast(s){el('toast').textContent=s;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),2800)}
function status(s){return `<span class="status ${s.toLowerCase()}">${s}</span>`}
function navItems(){return role==='customer'?[['home','⌂','Discover'],['mybookings','▤','My bookings'],['queue','◷','Queue tracker']]:role==='barber'?[['overview','▦','Overview'],['appointments','▤','Appointments'],['shopprofile','✂','Shop profile']]:[['overview','▦','Overview'],['shops','⌂','Partner shops'],['bookings','▤','All bookings'],['customers','♙','Customers'],['settings','⚙','Platform settings']]}
function drawSide(){el('sidebar').innerHTML=`<div style="width:100%"><div class="side-label">WORKSPACE</div>${navItems().map(([p,i,n])=>`<button class="navbtn ${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('')}<div class="aside-note"><b>TrimTime pilot</b><br>Book your cut. Skip the queue.<br><br>Prototype data is stored in this browser only.</div></div>`;el('roleLabel').textContent=role[0].toUpperCase()+role.slice(1)+' view'}
function go(p){page=p;drawSide();render()}
function title(k,sub,action=''){return `<div class="welcome"><div><div class="eyebrow">TRIMTIME WORKSPACE</div><h1>${k}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function metric(label,val,extra=''){return `<div class="metric"><small>${label}</small><strong>${val}</strong><em>${extra}</em></div>`}
function render(){drawSide();if(role==='customer')customer();else if(role==='barber')barber();else admin()}
function customer(){
 if(page==='mybookings'||page==='queue'){let rows=db.bookings.filter(b=>b.phone===sessionPhone||(!sessionPhone&&b.demo));el('app').innerHTML=title(page==='queue'?'Your queue tracker':'Your bookings','See your appointment requests and their latest status.')+(rows.length?`<div class="grid">${rows.slice().reverse().map(b=>bookingCard(b,true)).join('')}</div>`:`<div class="panel empty">No bookings in this browser yet.<br><button class="btn primary" style="margin-top:15px" onclick="go('home')">Find a barber</button></div>`);return}
 el('app').innerHTML=`<div class="hero"><div class="eyebrow" style="color:var(--lime)">CAMPUS GROOMING, MADE SIMPLE</div><h2>Book your cut.<br><span style="color:var(--lime)">Skip the queue.</span></h2><p>Discover nearby barbers and salons, choose a time that fits your day, and arrive when it is your turn.</p><button class="btn primary" onclick="document.getElementById('shopList').scrollIntoView({behavior:'smooth'})">Explore shops ↓</button></div>
 ${title('Find your next barber','Browse sample partner listings and request an appointment.')}
 <div class="grid cards" id="shopList">${db.shops.filter(s=>s.active).map(shopCard).join('')}</div>
 <div class="notice" style="margin-top:22px">Demo environment: shop listings, ratings, prices and time slots are illustrative. Booking requests are saved only in this browser; no real payment or notification is sent.</div>`;
}
function shopCard(s){return `<article class="shop-card"><div class="shop-art">${s.type==='Salon'?'💇':s.type==='Braiding'?'✨':'💈'}</div><div class="shop-body"><div class="row"><span class="chip">${s.type}</span><b>★ ${s.rating}</b></div><h3>${esc(s.name)}</h3><p class="muted">${esc(s.area)} · ${s.services.map(esc).join(' · ')}</p><div class="row" style="margin-top:15px"><span class="price">From ${money(s.price)}</span><button class="btn dark" onclick="book('${s.id}')">Book now</button></div></div></article>`}
let sessionPhone='';
function book(id){const s=db.shops.find(x=>x.id===id);show(`<h2>Book ${esc(s.name)}</h2><p class="muted">Choose a service and a preferred time.</p><form id="bookForm"><div class="field"><label>Your name</label><input name="name" required placeholder="Full name"></div><div class="field"><label>Phone number</label><input name="phone" required placeholder="024 000 0000"></div><div class="field"><label>Service</label><select name="service">${s.services.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Preferred time</label><select name="time">${['10:00 AM','10:30 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="notice">Sample deposit: ${money(db.deposit)}. It is intended to be deducted from the final service price. No payment will be collected in this demo.</div><button class="btn primary" type="submit">Submit booking request</button></form>`);
 el('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),b={id:'b'+Date.now(),name:f.get('name'),phone:f.get('phone'),shopId:s.id,shop:s.name,service:f.get('service'),date:f.get('date'),time:f.get('time'),price:s.price,deposit:db.deposit,status:'Pending',created:new Date().toISOString()};db.bookings.push(b);if(!db.customers.some(c=>c.phone===b.phone))db.customers.push({name:b.name,phone:b.phone,bookings:1});else db.customers.find(c=>c.phone===b.phone).bookings++;sessionPhone=b.phone;save();hide();toast('Booking request saved in this browser.');go('mybookings')}}
function bookingCard(b,customer=false){return `<div class="booking-card"><div class="row"><div><b>${esc(b.service)}</b><div class="muted">${esc(b.shop)} · ${dateFmt(b.date)} at ${esc(b.time)}</div></div>${status(b.status)}</div><div class="row" style="margin-top:13px"><span class="muted">${esc(b.name)} · ${esc(b.phone)}</span><b>${money(b.price)}</b></div>${customer?`<p class="fine muted">Deposit reference: ${money(b.deposit)} (demo only). ${b.status==='Confirmed'?'Your shop has confirmed this request.':b.status==='Pending'?'Waiting for the shop to confirm.':b.status==='Completed'?'Appointment marked completed.':'Check with the shop for updates.'}</p>`:''}</div>`}
function barber(){
 let my=db.bookings; if(page==='appointments'){el('app').innerHTML=title('Appointments','Review incoming requests and update appointment status.')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Service</th><th>Date & time</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${my.length?my.map(b=>`<tr><td>${esc(b.name)}<br><small>${esc(b.phone)}</small></td><td>${esc(b.service)}</td><td>${dateFmt(b.date)} · ${esc(b.time)}</td><td>${money(b.price)}</td><td>${status(b.status)}</td><td><select onchange="updateBooking('${b.id}',this.value)"><option ${b.status==='Pending'?'selected':''}>Pending</option><option ${b.status==='Confirmed'?'selected':''}>Confirmed</option><option ${b.status==='Completed'?'selected':''}>Completed</option><option ${b.status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No booking requests yet.</td></tr>`}</tbody></table></div></div>`;return}
 if(page==='shopprofile'){let s=db.shops[0];el('app').innerHTML=title('Shop profile','Manage your sample shop information.')+`<div class="panel" style="max-width:650px"><form id="profileForm"><div class="field"><label>Shop name</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>Location / area</label><input name="area" value="${esc(s.area)}" required></div><div class="field"><label>Starting price (GH₵)</label><input name="price" type="number" min="1" value="${s.price}" required></div><div class="field"><label>Services (comma separated)</label><input name="services" value="${esc(s.services.join(', '))}" required></div><button class="btn primary">Save profile</button></form></div>`;el('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(s,{name:f.get('name'),area:f.get('area'),price:+f.get('price'),services:f.get('services').split(',').map(x=>x.trim()).filter(Boolean)});save();toast('Shop profile updated');render()};return}
 let revenue=my.filter(b=>b.status==='Completed').reduce((a,b)=>a+b.price,0);el('app').innerHTML=title('Barber dashboard','A simple workspace for managing your bookings and daily business.',`<button class="btn primary" onclick="go('appointments')">View appointments</button>`)+`<div class="grid metrics">${metric('Booking requests',my.length)}${metric('Awaiting confirmation',my.filter(b=>b.status==='Pending').length)}${metric('Confirmed',my.filter(b=>b.status==='Confirmed').length)}${metric('Completed service value',money(revenue))}</div><div class="grid two"><div class="panel"><div class="panel-head"><h2>Recent appointments</h2><button class="btn light" onclick="go('appointments')">Manage</button></div>${my.length?my.slice(-5).reverse().map(b=>bookingCard(b)).join(''):'<div class="empty">Your booking requests will appear here.</div>'}</div><div class="panel"><h2>Quick guide</h2><p class="muted">1. Review each new request.<br>2. Confirm a suitable time or cancel if unavailable.<br>3. Mark the appointment completed after service.<br>4. Keep your shop profile and prices current.</p><div class="notice">This is a demonstration dashboard. For live use, staff accounts and permissions must be secured by a backend.</div></div></div>`;
}
function admin(){
 if(page==='shops'){el('app').innerHTML=title('Partner shops','Manage the sample shops shown to customers.',`<button class="btn primary" onclick="addShop()">+ Add shop</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Shop</th><th>Type</th><th>Location</th><th>Starting price</th><th>Visibility</th><th>Action</th></tr></thead><tbody>${db.shops.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.type)}</td><td>${esc(s.area)}</td><td>${money(s.price)}</td><td>${s.active?'Visible':'Hidden'}</td><td><button class="btn light" onclick="toggleShop('${s.id}')">${s.active?'Hide':'Show'}</button></td></tr>`).join('')}</tbody></table></div></div>`;return}
 if(page==='bookings'){el('app').innerHTML=title('All bookings','Monitor booking activity across the platform.')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Shop</th><th>Service</th><th>Date</th><th>Value</th><th>Status</th></tr></thead><tbody>${db.bookings.length?db.bookings.map(b=>`<tr><td>${esc(b.name)}<br><small>${esc(b.phone)}</small></td><td>${esc(b.shop)}</td><td>${esc(b.service)}</td><td>${dateFmt(b.date)} ${esc(b.time)}</td><td>${money(b.price)}</td><td>${status(b.status)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No bookings have been submitted.</td></tr>`}</tbody></table></div></div>`;return}
 if(page==='customers'){el('app').innerHTML=title('Customers','People who have submitted booking requests in this browser.')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Booking count</th></tr></thead><tbody>${db.customers.length?db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.bookings}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">No customer records yet.</td></tr>`}</tbody></table></div></div>`;return}
 if(page==='settings'){el('app').innerHTML=title('Platform settings','Adjust the demo booking assumptions.')+`<div class="panel" style="max-width:600px"><form id="settingsForm"><div class="field"><label>Platform commission (%)</label><input type="number" name="commission" min="0" max="100" value="${db.commission}"></div><div class="field"><label>Illustrative booking deposit (GH₵)</label><input type="number" name="deposit" min="0" value="${db.deposit}"></div><button class="btn primary">Save settings</button></form><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Demo data controls</h3><p class="muted">Reset the browser's local demo data to the original sample listings and remove demo bookings.</p><button class="btn danger" onclick="resetData()">Reset demo data</button></div>`;el('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.commission=+f.get('commission');db.deposit=+f.get('deposit');save();toast('Settings saved');render()};return}
 let completed=db.bookings.filter(b=>b.status==='Completed'),value=db.bookings.reduce((a,b)=>a+b.price,0),commission=value*db.commission/100;
 el('app').innerHTML=title('Admin overview','Your control centre for shops, customers and booking activity.')+`<div class="grid metrics">${metric('Total booking requests',db.bookings.length)}${metric('Partner shops',db.shops.length)}${metric('Registered customers',db.customers.length)}${metric('Potential commission',money(commission),'Based on all submitted booking value')}</div><div class="grid two"><div class="panel"><div class="panel-head"><h2>Latest booking activity</h2><button class="btn light" onclick="go('bookings')">All bookings</button></div>${db.bookings.length?db.bookings.slice(-5).reverse().map(b=>bookingCard(b)).join(''):'<div class="empty">No activity yet. Submit a customer booking to see it here.</div>'}</div><div class="panel"><h2>Platform snapshot</h2><div class="service-row"><span>Completed appointments</span><b>${completed.length}</b></div><div class="service-row"><span>Pending requests</span><b>${db.bookings.filter(b=>b.status==='Pending').length}</b></div><div class="service-row"><span>Completed service value</span><b>${money(completed.reduce((a,b)=>a+b.price,0))}</b></div><div class="service-row"><span>Commission assumption</span><b>${db.commission}%</b></div><div class="notice">Commission is an estimate, not collected revenue. Payment processing and actual settlements are not connected.</div></div></div>`;
}
function updateBooking(id,s){let b=db.bookings.find(x=>x.id===id);if(b){b.status=s;save();toast('Appointment status updated');render()}}
function addShop(){show(`<h2>Add partner shop</h2><form id="shopForm"><div class="field"><label>Shop name</label><input name="name" required></div><div class="formgrid"><div class="field"><label>Type</label><select name="type"><option>Barbershop</option><option>Salon</option><option>Braiding</option></select></div><div class="field"><label>Starting price (GH₵)</label><input name="price" type="number" min="1" required></div></div><div class="field"><label>Location</label><input name="area" required></div><div class="field"><label>Services (comma separated)</label><input name="services" required></div><button class="btn primary">Add shop</button></form>`);el('shopForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.shops.push({id:'s'+Date.now(),name:f.get('name'),type:f.get('type'),price:+f.get('price'),area:f.get('area'),services:f.get('services').split(',').map(x=>x.trim()),rating:5,active:true});save();hide();toast('Partner shop added');render()}}
function toggleShop(id){let s=db.shops.find(x=>x.id===id);s.active=!s.active;save();render()}
function openRole(){show(`<h2>Switch dashboard</h2><p class="muted">Choose the workspace you want to preview.</p><div class="grid"><button class="btn outline" onclick="setRole('customer')">♙ Customer dashboard</button><button class="btn outline" onclick="setRole('barber')">✂ Barber / shop dashboard</button><button class="btn outline" onclick="setRole('admin')">⚙ Platform admin dashboard</button></div><div class="notice">Role switching is for prototype testing only. A live product must use verified logins and role-based permissions.</div>`)}
function setRole(r){role=r;page=r==='customer'?'home':'overview';hide();render()}
function show(s){el('dialog').innerHTML=s;el('modal').classList.add('show')}
function hide(){el('modal').classList.remove('show')}
function resetData(){if(confirm('Reset all TrimTime demo data in this browser?')){db=structuredClone(seed);save();toast('Demo data reset');render()}}
